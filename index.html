<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fio da Lâmina · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Cena do jogo"></canvas>
<div id="veil"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
<div id="hurt"></div>
<div id="tags"></div>
<div id="hint" role="status" aria-live="polite"></div>
<div id="flash" aria-hidden="true"></div>
<div id="vit" aria-label="Vitalidade"><i></i><i></i></div>
<div id="pstab" aria-label="Estabilidade"><i></i><b></b></div>
<button id="stats" type="button" title="Toque para abrir os ajustes"></button>
<div id="joy"><div id="joyKnob"></div></div>
<div id="touchUI" hidden>
  <button class="tb" id="bDodge" type="button" aria-label="Esquivar"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17c3-7 8-10 15-9"/><path d="M15 4l4 4-4 4"/></svg><span class="lbl">esquiva</span></button>
  <button class="tb" id="bBlock" type="button" aria-label="Defender e aparar"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/></svg><span class="lbl">defesa</span></button>
  <button class="tb" id="bAtk" type="button" aria-label="Golpear"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg><svg class="ic" viewBox="0 0 24 24"><path d="M7 17L20 4"/><path d="M4.5 13.5l6 6"/><path d="M3 21l3.5-3.5"/></svg><span class="lbl">golpe · segure: forte</span></button>
</div>
<button id="menuBtn" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="rotate">Deite o celular para jogar</div>
<div id="start" role="button" tabindex="0" aria-label="Começar">
  <h1>Fio da<br>Lâmina</h1>
  <p class="sub">Protótipo de combate com espada. Treine com o boneco na clareira e siga a trilha: quatro encontros e um duelo esperam no caminho.</p>
  <p class="ctl" id="ctlText"></p>
  <span class="go" id="goText">Clique para começar</span>
</div>
<div id="fade"><span id="fadeText"></span></div>
<div id="end" role="dialog" aria-label="Fim da demonstração">
  <h2>Fim da<br>demonstração</h2>
  <p id="endStats"></p>
  <button type="button" id="again">Jogar de novo</button>
</div>
<div id="panel" hidden role="dialog" aria-label="Ajustes">
  <h3>Ajustes</h3>
  <div>Qualidade</div>
  <div class="qs"><button type="button" data-q="-1">auto</button><button type="button" data-q="0">mínima</button><button type="button" data-q="1">baixa</button><button type="button" data-q="2">média</button><button type="button" data-q="3">alta</button></div>
  <div class="sliders"></div>
  <div class="acts"><button type="button" id="pReport">Copiar relatório</button><button type="button" id="pSettings">Copiar ajustes</button><button type="button" id="pReset">Restaurar</button><button type="button" id="pClose">Fechar</button></div>
  <textarea hidden aria-label="Texto para copiar"></textarea>
</div>
<div id="loading">Preparando o campo…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
