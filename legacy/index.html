<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fio da Lâmina · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f2e7d1;
    --ink-dim: rgba(242, 231, 209, 0.64);
    --earth: #1b140c;
    --straw: #c7a25a;
    --blood: #7a1d12;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #f2e7d1; --earth: #1b140c; } }
  :root[data-theme="dark"] { --ink: #f2e7d1; --earth: #1b140c; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--earth); }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 52%, rgba(0,0,0,0) 56%, rgba(24, 12, 3, 0.5) 100%); }
  #veil { position: fixed; width: 150vmax; height: 150vmax; left: 50%; top: 30%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255, 222, 170, 0.9) 0%, rgba(255, 180, 105, 0.4) 9%, rgba(255, 150, 80, 0.12) 26%, rgba(255, 140, 70, 0) 50%);
    mix-blend-mode: screen; }
  #grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; background-size: 160px 160px; }
  .lb { position: fixed; left: 0; right: 0; height: 0; background: #070503; pointer-events: none; transition: height 0.9s ease; z-index: 2; }
  #lbT { top: 0; } #lbB { bottom: 0; }
  body.cine .lb { height: 10vh; }
  body.cine #bBlock, body.cine #bDodge, body.cine #vit, body.cine #pstab { opacity: 0; pointer-events: none; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse 70% 65% at 50% 50%, rgba(0,0,0,0) 50%, rgba(110, 18, 8, 0.55) 100%); }

  #hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(10vh + env(safe-area-inset-bottom, 0px));
    max-width: min(80vw, 36em); text-align: center; pointer-events: none;
    font-family: 'Shippori Mincho', 'Iowan Old Style', Georgia, serif;
    font-size: clamp(15px, 1.55vw, 20px); line-height: 1.45; letter-spacing: 0.02em; color: var(--ink);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.65);
    opacity: 0; transition: opacity 0.7s ease; padding: 0.6em 1.6em;
    background: radial-gradient(ellipse at center, rgba(12, 8, 3, 0.5) 0%, rgba(12, 8, 3, 0.25) 45%, rgba(12, 8, 3, 0) 75%);
  }
  #hint.on { opacity: 1; }
  #hint small { display: block; font-size: 0.78em; color: var(--ink-dim); margin-top: 0.2em; }
  #flash {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%, 0); pointer-events: none;
    font-family: 'Shippori Mincho', Georgia, serif; font-weight: 700; font-size: clamp(22px, 2.6vw, 34px);
    color: var(--ink); text-shadow: 0 2px 16px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #flash.on { opacity: 1; transform: translate(-50%, -6px); }

  #stats {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(54px + env(safe-area-inset-right, 0px));
    font: 12px/1.2 'Zen Kaku Gothic New', system-ui, sans-serif; color: var(--ink-dim);
    background: none; border: 0; padding: 8px; cursor: pointer;
  }
  #stats:focus-visible { outline: 1px solid var(--straw); }

  #vit { position: fixed; left: calc(24px + env(safe-area-inset-left, 0px)); top: calc(20px + env(safe-area-inset-top, 0px));
    display: flex; gap: 7px; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
  #vit.on { opacity: 1; }
  #vit i { display: block; width: 30px; height: 6px; background: var(--ink); border-radius: 3px 1px 3px 1px; transform: skewX(-24deg);
    box-shadow: 0 1px 6px rgba(0,0,0,0.5); transition: background 0.3s, opacity 0.3s; }
  #vit i.lost { background: var(--blood); opacity: 0.55; }

  #joy { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
    border: 1.5px solid rgba(242, 231, 209, 0.32); background: rgba(20, 13, 6, 0.16); display: none; pointer-events: none; }
  #joy.run { border-color: rgba(199, 162, 90, 0.85); }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(242, 231, 209, 0.5); }

  #touchUI[hidden] { display: none; }
  .tb { position: fixed; border-radius: 50%; border: 1.5px solid rgba(242, 231, 209, 0.38); color: var(--ink); display: grid; place-items: center; padding: 0;
    background: radial-gradient(circle at 50% 38%, rgba(48, 34, 18, 0.6), rgba(14, 9, 4, 0.62));
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), inset 0 0 0 5px rgba(242, 231, 209, 0.05);
    touch-action: none; transition: transform 0.08s ease, border-color 0.2s, box-shadow 0.2s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .tb svg.ic { width: 44%; height: 44%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tb .lbl { position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); font: 10px/1 'Zen Kaku Gothic New', system-ui, sans-serif;
    color: var(--ink-dim); letter-spacing: 0.04em; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  .tb.on { transform: scale(0.93); border-color: var(--straw); background: radial-gradient(circle at 50% 38%, rgba(199, 162, 90, 0.55), rgba(60, 40, 14, 0.6)); }
  .tb.good { box-shadow: 0 0 0 3px rgba(242, 208, 120, 0.9), 0 0 26px rgba(242, 190, 90, 0.8); }
  .tb.cool { opacity: 0.45; }
  .tb svg.ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); pointer-events: none; }
  .tb svg.ring circle { fill: none; stroke: var(--straw); stroke-width: 4; stroke-dasharray: 289; stroke-dashoffset: 289; stroke-linecap: round; }
  .tb svg.ring.full circle { stroke: #f2d078; filter: drop-shadow(0 0 4px rgba(242, 200, 110, 0.9)); }
  #bAtk   { width: 88px; height: 88px; right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); }
  #bBlock { width: 70px; height: 70px; right: calc(130px + env(safe-area-inset-right, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
  #bDodge { width: 62px; height: 62px; right: calc(44px + env(safe-area-inset-right, 0px)); bottom: calc(146px + env(safe-area-inset-bottom, 0px)); }
  #menuBtn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid rgba(242, 231, 209, 0.3); background: rgba(14, 9, 4, 0.45); color: var(--ink); display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 3; }
  #menuBtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: calc(6vh + env(safe-area-inset-top, 0px)) calc(6vw + env(safe-area-inset-right, 0px)) calc(7vh + env(safe-area-inset-bottom, 0px)) calc(6vw + env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(24, 15, 6, 0.8) 0%, rgba(24, 15, 6, 0.36) 40%, rgba(24, 15, 6, 0) 64%);
    color: var(--ink); cursor: pointer; transition: opacity 0.7s ease;
  }
  #start.gone { opacity: 0; pointer-events: none; }
  #start h1 { font-family: 'Shippori Mincho', 'Iowan Old Style', Georgia, serif; font-weight: 700;
    font-size: clamp(42px, 8vw, 108px); line-height: 0.92; letter-spacing: -0.015em; margin: 0 0 0.26em; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35); }
  #start .sub, #start .ctl { font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; max-width: 46ch; margin: 0.25em 0;
    font-size: clamp(13px, 1.35vw, 17px); line-height: 1.6; color: var(--ink-dim); }
  #start .go { margin-top: 1.2em; align-self: flex-start; font-family: 'Shippori Mincho', Georgia, serif; font-size: clamp(18px, 1.9vw, 23px);
    border-bottom: 1px solid var(--straw); padding-bottom: 0.12em; }
  #start:focus-visible .go { outline: 1px solid var(--straw); outline-offset: 6px; }
  @media (max-height: 430px) { #start h1 { font-size: 40px; } #start .sub { display: none; } }

  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translate(-50%, -100%); transition: opacity 0.3s; }
  .tag .bar { position: relative; width: 70px; height: 5px; background: rgba(12, 8, 4, 0.6); box-shadow: 0 0 6px rgba(0, 0, 0, 0.55); border-radius: 1px; overflow: hidden; }
  .tag .bar b, .tag .bar .tr { position: absolute; inset: 0; transform-origin: left center; }
  .tag .bar b { background: linear-gradient(#d4533c, #a8321f); }
  .tag .bar .tr { background: rgba(242, 231, 209, 0.75); }
  .tag.low .bar b { background: linear-gradient(#f0b44e, #c98424); }
  .tag.broken .bar { background: #f2e7d1; animation: blink 0.22s infinite alternate; }
  .tag .hp { display: flex; gap: 5px; }
  .tag .hp i { display: block; width: 5px; height: 5px; background: var(--ink); transform: rotate(45deg); box-shadow: 0 0 3px rgba(0,0,0,0.6); }
  .tag .hp i.off { opacity: 0.15; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.35; } }
  #pstab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(240px, 36vw); height: 5px; background: rgba(12, 8, 4, 0.55); box-shadow: 0 0 8px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.4s; pointer-events: none; overflow: hidden; border-radius: 1px; }
  #pstab::before, #pstab::after { content: ''; position: absolute; top: -3px; width: 1px; height: 11px; background: rgba(242, 231, 209, 0.5); }
  #pstab::before { left: 0; } #pstab::after { right: 0; }
  #pstab.on { opacity: 1; }
  #pstab b, #pstab i { position: absolute; inset: 0; transform-origin: left center; }
  #pstab i { background: rgba(194, 65, 45, 0.8); }
  #pstab b { background: linear-gradient(#f5ecd9, #cfc3a8); }
  #pstab.low b { background: linear-gradient(#f0b44e, #c98424); }
  #pstab.broken b { background: #c2412d; }
  #fade { position: fixed; inset: 0; background: #0d0905; opacity: 0; pointer-events: none; transition: opacity 0.9s ease;
    display: grid; place-items: center; font-family: 'Shippori Mincho', Georgia, serif; font-size: clamp(26px, 3vw, 40px); color: var(--ink); }
  #fade.on { opacity: 1; }
  #end { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: flex-end; color: var(--ink);
    padding: calc(6vh + env(safe-area-inset-top, 0px)) 6vw calc(8vh + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(18, 11, 4, 0.9), rgba(18, 11, 4, 0.3) 55%, rgba(18, 11, 4, 0)); }
  #end.on { display: flex; }
  #end h2 { font-family: 'Shippori Mincho', Georgia, serif; font-size: clamp(36px, 6vw, 80px); line-height: 0.95; margin: 0 0 0.3em; }
  #end p { font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; color: var(--ink-dim); margin: 0.2em 0; font-size: clamp(14px, 1.4vw, 17px); }
  #end button { margin-top: 1.2em; align-self: flex-start; background: none; border: 0; border-bottom: 1px solid var(--straw); color: var(--ink);
    font-family: 'Shippori Mincho', Georgia, serif; font-size: clamp(18px, 1.9vw, 23px); padding: 0 0 0.12em; cursor: pointer; }
  #panel { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
    width: min(330px, 92vw); max-height: 86vh; overflow: auto; background: rgba(16, 11, 6, 0.9); color: var(--ink);
    border: 1px solid rgba(242, 231, 209, 0.18); border-radius: 10px; padding: 14px 16px; z-index: 5;
    font: 13px/1.4 'Zen Kaku Gothic New', system-ui, sans-serif; -webkit-user-select: text; user-select: text; }
  #panel[hidden] { display: none; }
  #panel h3 { margin: 0 0 10px; font: 700 17px 'Shippori Mincho', Georgia, serif; }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 10px 0; }
  #panel .row input { grid-column: 1 / -1; width: 100%; accent-color: var(--straw); }
  #panel output { color: var(--ink-dim); }
  #panel .qs, #panel .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #panel button { background: rgba(242, 231, 209, 0.08); color: var(--ink); border: 1px solid rgba(242, 231, 209, 0.25); border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  #panel button.on { background: rgba(199, 162, 90, 0.4); border-color: var(--straw); }
  #panel textarea { width: 100%; height: 120px; margin-top: 8px; background: #0b0805; color: var(--ink); border: 1px solid rgba(242,231,209,0.2); font: 11px monospace; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--earth);
    font-family: 'Shippori Mincho', Georgia, serif; color: var(--ink-dim); font-size: 18px; transition: opacity 0.6s ease; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #rotate { display: none; position: fixed; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top, 0px)); text-align: center;
    font: 13px 'Zen Kaku Gothic New', system-ui, sans-serif; color: var(--ink-dim); pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  @media (prefers-reduced-motion: reduce) { #hint, #start, #loading, #flash { transition: none; } }
</style>

<body>
<canvas id="c" tabindex="0" aria-label="Cena do jogo"></canvas>
<div id="veil"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
<div id="hurt"></div>
<div id="tags"></div>
<div id="hint" role="status" aria-live="polite"></div>
<div id="flash" aria-hidden="true"></div>
<div id="vit" aria-label="Vitalidade"><i></i><i></i></div>
<div id="pstab" aria-label="Estabilidade"><i></i><b></b></div>
<button id="stats" type="button" title="Toque para abrir os ajustes"></button>
<div id="joy"><div id="joyKnob"></div></div>
<div id="touchUI" hidden>
  <button class="tb" id="bDodge" type="button" aria-label="Esquivar"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17c3-7 8-10 15-9"/><path d="M15 4l4 4-4 4"/></svg><span class="lbl">esquiva</span></button>
  <button class="tb" id="bBlock" type="button" aria-label="Defender e aparar"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/></svg><span class="lbl">defesa</span></button>
  <button class="tb" id="bAtk" type="button" aria-label="Golpear"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg><svg class="ic" viewBox="0 0 24 24"><path d="M7 17L20 4"/><path d="M4.5 13.5l6 6"/><path d="M3 21l3.5-3.5"/></svg><span class="lbl">golpe · segure: forte</span></button>
</div>
<button id="menuBtn" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="rotate">Deite o celular para jogar</div>
<div id="start" role="button" tabindex="0" aria-label="Começar">
  <h1>Fio da<br>Lâmina</h1>
  <p class="sub">Protótipo de combate com espada. Treine com o boneco na clareira e siga a trilha: quatro encontros e um duelo esperam no caminho.</p>
  <p class="ctl" id="ctlText"></p>
  <span class="go" id="goText">Clique para começar</span>
</div>
<div id="fade"><span id="fadeText"></span></div>
<div id="end" role="dialog" aria-label="Fim da demonstração">
  <h2>Fim da<br>demonstração</h2>
  <p id="endStats"></p>
  <button type="button" id="again">Jogar de novo</button>
</div>
<div id="panel" hidden role="dialog" aria-label="Ajustes">
  <h3>Ajustes</h3>
  <div>Qualidade</div>
  <div class="qs"><button type="button" data-q="-1">auto</button><button type="button" data-q="0">mínima</button><button type="button" data-q="1">baixa</button><button type="button" data-q="2">média</button><button type="button" data-q="3">alta</button></div>
  <div class="sliders"></div>
  <div class="acts"><button type="button" id="pReport">Copiar relatório</button><button type="button" id="pSettings">Copiar ajustes</button><button type="button" id="pReset">Restaurar</button><button type="button" id="pClose">Fechar</button></div>
  <textarea hidden aria-label="Texto para copiar"></textarea>
</div>
<div id="loading">Preparando o campo…</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================================================================
   CONFIG — todos os números de ajuste ficam aqui
   ================================================================ */
const CFG = {
  world:  { size: 800, hmRes: 512, seed: 1337 },
  player: { walk: 2.3, run: 5.6, stanceSpeed: 1.9, blockSpeed: 1.25, accel: 9, decel: 12, turnRate: 12, radius: 0.35 },
  camera: {
    dist: 3.6, pivotH: 1.52, shoulder: 0.26, pitch: -0.13, pitchMin: -0.62, pitchMax: 0.24, stanceDist: 1.0,
    fov: 58, fovRun: 63, mouseSens: 0.0022, touchSens: 0.0058, minClear: 0.95,
  },
  combat: {
    parryWindow: 0.16,   // s antes do contato em que apertar a defesa vira aparar
    parryRearm: 0.35,    // apertar a defesa de novo antes disso não abre janela (anti-spam)
    dodge: { dur: 0.3, dist: 2.7, iStart: 0.03, iEnd: 0.24, cooldown: 0.18 },
    regen: 7,            // s sem apanhar para recuperar a vitalidade
    stanceRange: 6.5,    // distância em que o personagem encara o alvo
  },
  fog:  { density: 0.0024, falloff: 0.011 },
  sun:  new THREE.Vector3(0.2, 0.19, -1).normalize(),
  wind: new THREE.Vector2(0.55, -0.83).normalize(),
};

// O sol se move: tarde na clareira, pôr do sol no duelo. Todas as cores do céu e da neblina
// vêm destes uniforms, compartilhados por TODOS os materiais (injetados no onBeforeCompile).
const SUN_AZ = 0.2;
const SUN = new THREE.Vector3().copy(CFG.sun);
const ATMO = {
  uSunDir: { value: SUN },
  uSkyZen: { value: new THREE.Color(0.25, 0.37, 0.54) },
  uSkyHor: { value: new THREE.Color(0.76, 0.66, 0.5) },
  uSkyHaze: { value: new THREE.Color(1.32, 0.96, 0.58) },
  uFogDen: { value: CFG.fog.density },
  uLow: { value: 0 },
  uRimCol: { value: new THREE.Color(1, 0.8, 0.6) },
};
function injectAtmo(sh) { Object.assign(sh.uniforms, ATMO); }
THREE.Material.prototype.onBeforeCompile = injectAtmo;

const PATH_POINTS = [[3,172],[0,150],[-6,125],[2,95],[12,65],[8,35],[-4,5],[-12,-25],[-6,-55],[6,-85],[10,-115],[0,-145],[-6,-172]];
const CLEARING = { x: 1, z: 158, r: 12, h: 0 };
const DUMMY_POS = { x: 1.5, z: 152.5 };

const URLP = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;

/* ================================================================
   UTIL
   ================================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const yawTo = (from, to) => Math.atan2(-(to.x - from.x), -(to.z - from.z));

function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy, s), hash2(ix + 1, iy, s), ux), lerp(hash2(ix, iy + 1, s), hash2(ix + 1, iy + 1, s), ux), uy);
}
function fbm(x, y, oct, s) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, s + i * 17); norm += amp; amp *= 0.5; f *= 2.03; }
  return (sum / norm) * 2 - 1;
}
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = mulberry32(CFG.world.seed);

// distância entre dois segmentos (Ericson) — usada para acertos de espada
const _d1 = new THREE.Vector3(), _d2 = new THREE.Vector3(), _r = new THREE.Vector3(), _c2 = new THREE.Vector3();
function segSeg(p1, q1, p2, q2, outC1) {
  _d1.subVectors(q1, p1); _d2.subVectors(q2, p2); _r.subVectors(p1, p2);
  const a = _d1.dot(_d1), e = _d2.dot(_d2), f = _d2.dot(_r), c = _d1.dot(_r), b = _d1.dot(_d2);
  const den = a * e - b * b;
  let s = den > 1e-8 ? clamp((b * f - c * e) / den, 0, 1) : 0;
  let t = (b * s + f) / e;
  if (t < 0) { t = 0; s = clamp(-c / a, 0, 1); } else if (t > 1) { t = 1; s = clamp((b - c) / a, 0, 1); }
  outC1.copy(p1).addScaledVector(_d1, s); _c2.copy(p2).addScaledVector(_d2, t);
  return outC1.distanceTo(_c2);
}

/* ================================================================
   ATMOSFERA — céu e neblina usam a mesma função de cor
   ================================================================ */
const v3 = (v) => `vec3(${v.x.toFixed(5)}, ${v.y.toFixed(5)}, ${v.z.toFixed(5)})`;
const SKY_GLSL = /* glsl */`
uniform vec3 uSunDir, uSkyZen, uSkyHor, uSkyHaze;
uniform float uFogDen, uLow;
vec3 skyColor(vec3 d) {
  float y = d.y;
  float s = max(dot(d, uSunDir), 0.0);
  vec3 col = mix(uSkyHor, uSkyZen, pow(clamp(y, 0.0, 1.0), 0.5));
  col = mix(col, uSkyHor * 0.9, 1.0 - smoothstep(-0.08, 0.0, y));
  col += uSkyHaze * (pow(s, 3.0) * 0.25 + pow(s, 16.0) * 0.5 + pow(s, 120.0) * 1.0);
  // no pôr do sol, uma faixa larga e quente abraça o horizonte do lado do sol
  vec2 hz = normalize(d.xz + 1e-5), hs = normalize(uSunDir.xz + 1e-5);
  col += uSkyHaze * uLow * 0.45 * exp(-max(y, 0.0) * 7.0) * pow(max(dot(hz, hs), 0.0), 2.5);
  return col;
}
vec4 fogCalc(vec3 wpos) {
  vec3 ray = wpos - cameraPosition;
  float dist = length(ray);
  vec3 n = ray / max(dist, 1e-4);
  const float fh = ${CFG.fog.falloff.toFixed(5)};
  float dy = ray.y;
  float integ = abs(fh * dy) > 1e-3 ? (1.0 - exp(-fh * dy)) / (fh * dy) : 1.0;
  float amt = uFogDen * dist * exp(-fh * max(cameraPosition.y, 0.0)) * integ;
  amt = 1.55 * pow(amt, 1.55);
  return vec4(skyColor(normalize(vec3(n.x, max(n.y, 0.0) * 0.3 + 0.001, n.z))), clamp(1.0 - exp(-amt), 0.0, 1.0));
}
// cor de neblina convertida para o espaço de saída (funciona com e sem pós-processamento)
vec3 fogToOutput(vec3 c) {
  #ifdef TONE_MAPPING
    c = toneMapping(c);
  #endif
  return linearToOutputTexel(vec4(c, 1.0)).rgb;
}`;

THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace(
  'vec3 CustomToneMapping( vec3 color ) { return color; }',
  `vec3 CustomToneMapping( vec3 color ) {
    vec3 c = ACESFilmicToneMapping( color );
    float l = dot( c, vec3( 0.2126, 0.7152, 0.0722 ) );
    c *= mix( vec3( 0.93, 0.98, 1.06 ), vec3( 1.05, 1.0, 0.91 ), smoothstep( 0.08, 0.7, l ) );
    c = mix( vec3( l ), c, 1.1 );
    c = clamp( c, 0.0, 1.0 );
    return c * c * ( 3.0 - 2.0 * c ) * 0.22 + c * 0.78;

THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogWorldPos;
#endif`;

THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG

{ vec4 fg = fogCalc(vFogWorldPos); gl_FragColor.rgb = mix(gl_FragColor.rgb, fogToOutput(fg.rgb), fg.a); }
#endif`;

/* ================================================================
   TERRENO — mapa de altura + máscara da trilha (CPU e GPU)
   ================================================================ */
class Terrain {
  constructor() {
    const S = CFG.world.size, N = CFG.world.hmRes;
    this.S = S; this.N = N;
    this.h = new Float32Array(N * N);
    this.curve = new THREE.CatmullRomCurve3(PATH_POINTS.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
    const M = Math.ceil(this.curve.getLength());
    const raw = [];
    this.ps = [];
    for (let i = 0; i <= M; i++) {
      const p = this.curve.getPointAt(i / M);
      this.ps.push({ x: p.x, z: p.z, h: 0 });
      raw.push(Terrain.rawHeight(p.x, p.z));
    }
    for (let i = 0; i < this.ps.length; i++) {
      let s = 0, n = 0;
      for (let k = -14; k <= 14; k++) { s += raw[clamp(i + k, 0, raw.length - 1)]; n++; }
      this.ps[i].h = s / n;
    }
    CLEARING.h = this.ps[this.nearest(CLEARING.x, CLEARING.z).i].h;
    const data = new Uint16Array(N * N * 4), toH = THREE.DataUtils.toHalfFloat;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = (i + 0.5) / N * S - S / 2, z = (j + 0.5) / N * S - S / 2;
      const { d, i: pi } = this.nearest(x, z);
      let h = lerp(this.ps[pi].h, Terrain.rawHeight(x, z), smooth(1.6, 10, d));
      const cd = Math.hypot(x - CLEARING.x, z - CLEARING.z);
      h = lerp(CLEARING.h, h, smooth(CLEARING.r, CLEARING.r + 10, cd));
      let path = 1 - smooth(0.45, 1.25, d);
      path = Math.max(path, (1 - smooth(CLEARING.r - 5, CLEARING.r + 1, cd)) * 0.26);
      let dens = lerp(0.5, 1, smooth(1.0, 3.2, d)) * (0.8 + 0.4 * vnoise(x / 14, z / 14, 5));
      dens *= lerp(0.45, 1, smooth(CLEARING.r - 2, CLEARING.r + 3, cd));
      const k = j * N + i;
      this.h[k] = h;
      data[k * 4] = toH(h); data[k * 4 + 1] = toH(path); data[k * 4 + 2] = toH(dens); data[k * 4 + 3] = toH(vnoise(x / 38, z / 38, 9));
    }
    this.tex = new THREE.DataTexture(data, N, N, THREE.RGBAFormat, THREE.HalfFloatType);
    this.tex.minFilter = this.tex.magFilter = THREE.LinearFilter;
    this.tex.generateMipmaps = false;
    this.tex.needsUpdate = true;
  }
  static rawHeight(x, z) {
    let h = fbm(x / 160, z / 160, 4, 1) * 9 + fbm(x / 55, z / 55, 3, 7) * 2.2;
    const dip = Math.exp(-Math.pow(angDiff(SUN_AZ, Math.atan2(x, -z)) / 0.42, 2));
    return h + smooth(230, 390, Math.hypot(x, z * 0.82)) * 38 * (1 - 0.85 * dip);
  }
  nearest(x, z) {
    const ps = this.ps; let best = Infinity, bi = 0;
    for (let i = 0; i < ps.length; i += 8) { const dx = ps[i].x - x, dz = ps[i].z - z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i; } }
    const a = Math.max(0, bi - 9), b = Math.min(ps.length - 1, bi + 9);
    for (let i = a; i <= b; i++) { const dx = ps[i].x - x, dz = ps[i].z - z, d = dx * dx + dz * dz; if (d < best) { best = d; bi = i; } }
    return { d: Math.sqrt(best), i: bi };
  }
  heightAt(x, z) {
    const N = this.N;
    let fx = clamp((x / this.S + 0.5) * N - 0.5, 0, N - 1.001), fz = clamp((z / this.S + 0.5) * N - 0.5, 0, N - 1.001);
    const ix = Math.floor(fx), iz = Math.floor(fz), tx = fx - ix, tz = fz - iz, H = this.h;
    return lerp(lerp(H[iz * N + ix], H[iz * N + ix + 1], tx), lerp(H[(iz + 1) * N + ix], H[(iz + 1) * N + ix + 1], tx), tz);
  }
}

const canvas = document.getElementById('c');

const composer = new EffectComposer(renderer, rt);

const makeRays = (n) => new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSunUv: { value: new THREE.Vector2(0.5, 0.5) }, uAmt: { value: 0 }, uTint: { value: new THREE.Color(1, 0.8, 0.6) }, uAspect: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `#define SAMPLES ${n}
    uniform sampler2D tDiffuse; uniform vec2 uSunUv; uniform float uAmt, uAspect; uniform vec3 uTint; varying vec2 vUv;
    void main() {
      vec3 base = texture2D(tDiffuse, vUv).rgb;
      if (uAmt < 0.002) { gl_FragColor = vec4(base, 1.0); return; }
      vec2 d = (vUv - uSunUv) * (0.95 / float(SAMPLES));
      vec2 c = vUv - d * fract(sin(dot(vUv, vec2(12.9898, 78.233))) * 43758.5453);
      float w = 1.0; vec3 acc = vec3(0.0);
      for (int i = 0; i < SAMPLES; i++) {
        c -= d;
        vec3 sm = texture2D(tDiffuse, c).rgb;
        acc += min(sm, vec3(8.0)) * smoothstep(3.2, 9.0, dot(sm, vec3(0.3, 0.59, 0.11))) * w;
        w *= ${n > 20 ? '0.968' : '0.94'};
      }
      acc /= float(SAMPLES);
      float fall = 1.0 - smoothstep(0.0, 0.95, length((vUv - uSunUv) * vec2(uAspect, 1.0)));
      gl_FragColor = vec4(base + acc * uTint * uAmt * (0.15 + fall * 0.85), 1.0);
    }`,
});
const raysHi = makeRays(32), raysLo = makeRays(12);
composer.addPass(raysHi); composer.addPass(raysLo);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.36, 0.7, 1.0);
composer.addPass(bloom);
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, toneMappingExposure: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    #include <tonemapping_pars_fragment>

      #include <colorspace_fragment>
    }`,
});
finalPass.material.toneMapped = false;
composer.addPass(finalPass);

const SH = {
  uTime:    { value: 0 },
  uHM:      { value: terrain.tex },
  uWorldSize: { value: CFG.world.size },
  uWindDir: { value: CFG.wind.clone() },

// Lambert com brilho de contraluz (folhas, partes finas)
function withBacklight(mat, k) {
  mat.onBeforeCompile = (sh) => {
    injectAtmo(sh);
    sh.uniforms.uSunDirU = SH.uSunDirU; sh.uniforms.uSunCol = SH.uSunCol;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vBW;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvBW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vBW; uniform vec3 uSunDirU; uniform vec3 uSunCol;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float bl = pow(max(dot(normalize(vBW - cameraPosition), uSunDirU), 0.0), 5.0);
        totalEmissiveRadiance += diffuseColor.rgb * uSunCol * bl * ${k.toFixed(2)};`);
  };
  return mat;
}

// Contorno de luz: com o sol atrás do personagem, as bordas da silhueta acendem (marca da referência)
function withRim(mat, k = 1.3) {
  mat.onBeforeCompile = (sh) => {
    injectAtmo(sh);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 uRimCol;\n#ifndef USE_FOG\nuniform vec3 uSunDir;\n#endif').replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      {
        vec3 vd = normalize(vViewPosition);
        vec3 sv = normalize((viewMatrix * vec4(uSunDir, 0.0)).xyz);
        float rim = pow(1.0 - clamp(abs(dot(normal, vd)), 0.0, 1.0), 5.0);
        float back = pow(max(dot(-vd, sv), 0.0), 2.0);
        totalEmissiveRadiance += uRimCol * rim * back * ${k.toFixed(2)};
      }`);
  };
  mat.customProgramCacheKey = () => 'rim' + k;
  return mat;
}
const hemi = new THREE.HemisphereLight(0xa9bccf, 0x5a4428, 1.05);

// ---------- Céu ----------
let skyMat;
{

    side: THREE.BackSide, depthWrite: false, fog: false,

{
  const S = CFG.world.size;

  for (let i = 0; i < pos.count; i++) pos.setY(i, terrain.heightAt(pos.getX(i), pos.getZ(i)));

      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvTW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', /* glsl */`#include <common>
        varying vec3 vTW;

      .replace('#include <color_fragment>', /* glsl */`
        vec4 thm = texture2D(uHM, vTW.xz / uWorldSize + 0.5);
        float n1 = tNoise(vTW.xz * 0.35), n2 = tNoise(vTW.xz * 2.3), n3 = tNoise(vTW.xz * 0.045);
        float pathM = smoothstep(0.32, 0.72, thm.g + (n2 - 0.5) * 0.34 + (n1 - 0.5) * 0.22);
        vec3 dirt = mix(vec3(0.33, 0.26, 0.18), vec3(0.44, 0.36, 0.26), n2 * 0.7 + n1 * 0.3);
        float pc = smoothstep(0.55, 0.98, thm.g);
        dirt = mix(dirt * vec3(0.72, 0.68, 0.64), dirt * vec3(1.08, 1.05, 1.0), pc);
        dirt *= 0.9 + 0.2 * tNoise(vTW.xz * 9.0);
        float tFar = smoothstep(30.0, 70.0, distance(vTW.xz, cameraPosition.xz));
        float twave = sin(dot(vTW.xz, uWindDir) * 0.11 - uTime * 1.5) * 0.5 + 0.5;
        float streak = tNoise(vec2(dot(vTW.xz, uWindDir) * 0.08, dot(vTW.xz, vec2(-uWindDir.y, uWindDir.x)) * 0.9));
        vec3 tGold = mix(vec3(0.36, 0.25, 0.11), vec3(0.64, 0.46, 0.22), clamp(n3 * 0.45 + streak * 0.3 + twave * 0.3, 0.0, 1.0));
        tGold *= mix(0.55, 1.08, smoothstep(0.25, 0.75, streak)) * mix(0.8, 1.0, n1);

// ---------- Grama instanciada com LOD contínuo ----------
// Em vez de "encolher" a grama na borda (o que criava um anel de grama feia), as hastes
// somem aleatoriamente e as que restam ficam mais largas; a camada distante entra
// exatamente onde a próxima rareia. A neblina é calculada por vértice (bem mais barato).
const GRASS_VS = /* glsl */`
  uniform float uTime, uSize, uRadius, uBladeH, uBladeW, uWorldSize, uNearCam, uFadeStart, uWiden, uIsMid, uNearR, uFarWiden;
  uniform vec3 uCenter, uNearCenter;
  uniform sampler2D uHM;
  uniform vec2 uWindDir, uShadowDir;
  uniform float uShadowLen;
  uniform vec3 uSunCol, uAmb, uSunDirU;
  uniform vec4 uPush[4];
  uniform vec4 uCast[4];
  attribute vec4 aOffset;
  varying vec3 vCol; varying vec4 vFog;
  ${SKY_GLSL.split('vec3 fogToOutput')[0]}
  void main() {
    vec2 p = aOffset.xy * uSize;
    vec2 wp = uCenter.xz + mod(p - uCenter.xz + 0.5 * uSize, uSize) - 0.5 * uSize;
    float r1 = aOffset.z, r2 = aOffset.w;
    float rk = fract(r1 * 7.13 + r2 * 3.71);
    vec4 hm = texture2D(uHM, wp / uWorldSize + 0.5);

    float d = distance(wp, uCenter.xz);
    float outT = smoothstep(uRadius * uFadeStart, uRadius, d);
    float keep = step(outT, rk * 0.999);
    float widen = 1.0 + outT * uWiden;
    if (uIsMid > 0.5) {
      float inT = smoothstep(uNearR * 0.45, uNearR * 0.95, distance(wp, uNearCenter.xz));
      keep *= step(fract(r2 * 11.3 + r1 * 2.9), inT);
    }
    float camD = distance(wp, cameraPosition.xz);
    keep *= smoothstep(0.25, 0.9, camD);
    float onPath = smoothstep(0.25, 0.7, hm.g);
    float pathTuft = step(0.86, fract(r1 * 91.7)) * 0.22;
    float h0 = uBladeH * mix(0.62, 1.3, r1 * r1) * clamp(hm.b, 0.0, 1.3) * mix(1.0, pathTuft, onPath) * keep;

    float h = position.y;
    float isPlume = step(0.7, fract(r2 * 17.0));
    float wTaper = 1.0 - h * 0.9;
    float wPlume = h < 0.58 ? 0.4 : 0.4 + sin((h - 0.58) / 0.42 * 3.14159) * 1.75;
    float width = uBladeW * mix(wTaper, wPlume, isPlume) * (1.0 - smoothstep(0.9, 1.0, h) * 0.92) * widen;
    width *= mix(uNearCam, 1.0, smoothstep(4.0, 18.0, camD)) * mix(1.0, uFarWiden, smoothstep(22.0, 100.0, camD));

    vec2 toCam = normalize(cameraPosition.xz - wp + 1e-4);
    vec2 camSide = vec2(-toCam.y, toCam.x);
    float ang = r2 * 6.28318;
    vec2 rnd = vec2(cos(ang), sin(ang));
    vec2 side = normalize(mix(rnd, camSide * sign(dot(rnd, camSide) + 1e-4), 0.6));

    vec2 wperp = vec2(-uWindDir.y, uWindDir.x);
    float wave = sin(dot(wp, uWindDir) * 0.11 - uTime * 1.6 + sin(dot(wp, wperp) * 0.05) * 1.6) * 0.5 + 0.5;
    float flutter = sin(uTime * 2.8 + r1 * 31.0 + wp.x * 0.9 + wp.y * 0.6) * 0.5 + 0.5;
    vec2 bend = uWindDir * (0.08 + 0.24 * wave + 0.07 * flutter) + rnd * (r1 - 0.5) * 0.16;

    float shade = 1.0;
    for (int i = 0; i < 4; i++) {
      vec4 pu = uPush[i];
      if (pu.w > 0.0) {
        vec2 dv = wp - pu.xy; float l = length(dv);
        bend += dv / (l + 1e-3) * (1.0 - smoothstep(0.12, pu.z, l)) * pu.w;
      }
      vec4 c = uCast[i];
      if (c.w > 0.0) {
        vec2 rel = wp - c.xy;
        float along = dot(rel, uShadowDir);
        float lat = abs(dot(rel, vec2(-uShadowDir.y, uShadowDir.x)));
        float L = c.z * uShadowLen;
        float sw = mix(0.2, 0.46, clamp(along / L, 0.0, 1.0));
        float s = smoothstep(-0.4, 0.3, along) * (1.0 - smoothstep(L * 0.78, L, along)) * (1.0 - smoothstep(sw * 0.55, sw, lat));
        shade = min(shade, 1.0 - 0.6 * s * c.w);
      }
    }
    float bl = length(bend); if (bl > 1.15) bend *= 1.15 / bl;
    float hh = h * h;
    vec3 local;
    local.xz = side * position.x * width + bend * hh * h0;
    local.y = h * h0 * (1.0 - 0.3 * min(dot(bend, bend), 1.0) * hh);
    vec3 world = vec3(wp.x, hm.r, wp.y) + local;

    vec3 base = vec3(0.11, 0.075, 0.035);
    float cv = fract(r1 * 23.1);
    vec3 tip = cv < 0.5 ? mix(vec3(0.84, 0.55, 0.23), vec3(0.72, 0.57, 0.3), cv * 2.0)
                        : mix(vec3(0.84, 0.55, 0.23), vec3(0.52, 0.35, 0.16), (cv - 0.5) * 2.0);
    vec3 col = mix(base, tip, smoothstep(0.0, 0.78, h));
    col = mix(col, vec3(0.9, 0.78, 0.56), isPlume * smoothstep(0.58, 0.92, h));
    col *= (0.78 + 0.4 * wave) * mix(0.84, 1.1, hm.a);

    // luz por vértice: ambiente + sol + contraluz nas pontas
    float back = pow(max(dot(normalize(world - cameraPosition), uSunDirU), 0.0), 3.0);
    float sgn = dot(side, uSunDirU.xz) >= 0.0 ? 1.0 : -1.0;
    float across = 0.8 + 0.36 * (position.x * sgn + 0.5);
    vec3 lit = (col * (uAmb + uSunCol * 0.5 * shade) + col * uSunCol * back * h * 1.35 * shade) * across;
    lit *= mix(0.32, 1.0, smoothstep(0.0, 0.42, h));
    vCol = lit;
    vFog = fogCalc(world);
    gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
  }`;
const GRASS_FS = /* glsl */`
  varying vec3 vCol; varying vec4 vFog;
  void main() {
    gl_FragColor = vec4(vCol, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    vec3 fc = vFog.rgb;
    #ifdef TONE_MAPPING
      fc = toneMapping(fc);
    #endif
    fc = linearToOutputTexel(vec4(fc, 1.0)).rgb;
    gl_FragColor.rgb = mix(gl_FragColor.rgb, fc, vFog.a);
  }`;

function makeGrass({ max, segs, bladeH, bladeW, nearCam, fadeStart, widen, isMid, farWiden, seed }) {
  const g = new THREE.InstancedBufferGeometry();
  const pos = [], idx = [];
  for (let i = 0; i <= segs; i++) { const y = i / segs; pos.push(-0.5, y, 0, 0.5, y, 0); }
  for (let i = 0; i < segs; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const r = mulberry32(seed), off = new Float32Array(max * 4);
  for (let i = 0; i < max * 4; i++) off[i] = r();
  const nClumps = Math.floor(max / 14);
  const cx = new Float32Array(nClumps), cz = new Float32Array(nClumps);
  for (let c = 0; c < nClumps; c++) { cx[c] = r(); cz[c] = r(); }
  for (let i = 0; i < max; i++) {
    if (r() > 0.62) continue;
    const c = Math.floor(r() * nClumps), a = r() * Math.PI * 2, d = Math.sqrt(-2 * Math.log(r() + 1e-6)) * 0.006;
    off[i * 4] = (cx[c] + Math.cos(a) * d + 1) % 1; off[i * 4 + 1] = (cz[c] + Math.sin(a) * d + 1) % 1;
  }
  g.setAttribute('aOffset', new THREE.InstancedBufferAttribute(off, 4));
  g.instanceCount = max;
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: SH.uTime, uHM: SH.uHM, uWorldSize: SH.uWorldSize, uWindDir: SH.uWindDir,
      uPush: SH.uPush, uCast: SH.uCast, uShadowDir: SH.uShadowDir, uShadowLen: SH.uShadowLen,
      uSunCol: SH.uSunCol, uAmb: SH.uAmb, uSunDirU: SH.uSunDirU,
      uCenter: { value: new THREE.Vector3() }, uNearCenter: { value: new THREE.Vector3() }, uNearR: { value: 20 },
      uSize: { value: 50 }, uRadius: { value: 25 }, uFadeStart: { value: fadeStart }, uWiden: { value: widen },
      uIsMid: { value: isMid ? 1 : 0 }, uFarWiden: { value: farWiden },
      uBladeH: { value: bladeH }, uBladeW: { value: bladeW }, uNearCam: { value: nearCam },
    },
    vertexShader: GRASS_VS, fragmentShader: GRASS_FS, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

function taperTube(pts, r0, r1, radial = 7, segs = 8) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], idx = [], P = new THREE.Vector3();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs; curve.getPointAt(t, P);
    const r = lerp(r0, r1, t), N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(P.x + (N.x * c + B.x * s) * r, P.y + (N.y * c + B.y * s) * r, P.z + (N.z * c + B.z * s) * r);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const blobBase = [0, 1, 2].map((v) => {
  const g = new THREE.SphereGeometry(1, 11, 8);
  g.deleteAttribute('uv');
  const p = g.attributes.position, t = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    t.fromBufferAttribute(p, i);
    t.multiplyScalar(1 + fbm(t.x * 1.7 + v * 3, t.y * 1.7 + t.z * 1.3, 3, 60 + v) * 0.26);
    p.setXYZ(i, t.x, t.y, t.z);
  }
  g.computeVertexNormals();
  return g;
});
function canopyPad(out, cx, cy, cz, w, flat, n, tintCol = [0.17, 0.2, 0.085]) {
  for (let k = 0; k < n; k++) {
    const g = blobBase[k % 3].clone();
    const a = rand() * Math.PI * 2, rr = Math.sqrt(rand()) * w * 0.58;
    const s = w * (0.3 + rand() * 0.2);
    const sy = s * flat * (0.8 + rand() * 0.4);
    g.scale(s, sy, s);
    const px = cx + Math.cos(a) * rr, pz = cz + Math.sin(a) * rr, py = cy + (rand() - 0.5) * w * flat * 0.35;
    g.translate(px, py, pz);
    const pos = g.attributes.position, col = new Float32Array(pos.count * 3), tint = 0.82 + rand() * 0.32;
    for (let i = 0; i < pos.count; i++) {
      const k2 = clamp((pos.getY(i) - (py - sy)) / (2 * sy), 0, 1);
      const sh = lerp(0.38, 1.0, k2 * k2) * tint;
      col[i * 3] = tintCol[0] * sh; col[i * 3 + 1] = tintCol[1] * sh; col[i * 3 + 2] = tintCol[2] * sh;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.push(g);
  }
}

function makeTree(x, z, kind, leafCol, scale = 1) {
  const y0 = terrain.heightAt(x, z), pine = kind === 'pine';
  const H = pine ? 3.2 + rand() * 1.6 : 3.6 + rand() * 1.6;
  const lx = (rand() - 0.5) * 1.5, lz = (rand() - 0.5) * 1.0;
  const top = new THREE.Vector3(lx, H, lz);
  const trunk = [new THREE.Vector3(0, -0.4, 0), new THREE.Vector3(lx * 0.12, H * 0.35, lz * 0.1),
    new THREE.Vector3(lx * 0.7 + (rand() - 0.5) * 0.5, H * 0.7, lz * 0.6), top];
  const bark = [taperTube(trunk, 0.38, 0.15)], leaves = [];
  const nb = pine ? 3 + Math.floor(rand() * 2) : 4 + Math.floor(rand() * 2);
  for (let b = 0; b < nb; b++) {
    const a = (b / nb) * Math.PI * 2 + rand() * 0.8;
    const reach = pine ? 1.7 + rand() * 1.6 : 0.9 + rand() * 1.1;
    const rise = pine ? 0.2 + rand() * 0.9 : 0.4 + rand() * 1.8;
    const start = new THREE.Vector3().lerpVectors(trunk[2], top, 0.3 + rand() * 0.7);
    const end = top.clone().add(new THREE.Vector3(Math.cos(a) * reach, rise, Math.sin(a) * reach));
    const mid = start.clone().lerp(end, 0.5).add(new THREE.Vector3(0, 0.3, 0));
    bark.push(taperTube([start, mid, end], 0.12, 0.05, 5, 5));
    canopyPad(leaves, end.x, end.y + 0.2, end.z, pine ? 1.9 + rand() * 0.9 : 1.4 + rand() * 0.7, pine ? 0.42 : 0.62, pine ? 8 : 7, leafCol);
  }
  canopyPad(leaves, top.x, top.y + 0.55, top.z, pine ? 1.9 : 1.8, pine ? 0.45 : 0.7, 8, leafCol);
  const grp = new THREE.Group();
  const tm = new THREE.Mesh(mergeGeometries(bark), barkMat), lm = new THREE.Mesh(mergeGeometries(leaves), leafMat);
  tm.castShadow = lm.castShadow = true; tm.receiveShadow = true;
  grp.add(tm, lm);
  grp.position.set(x, y0, z); grp.rotation.y = rand() * Math.PI * 2; grp.scale.setScalar(scale);
  scene.add(grp);
  colliders.push({ x, z, r: 0.5 * scale, top: y0 + H * scale });
  return grp;
}

function makeRidge(radius, baseY, minH, maxH, seed, color, bumps, notch) {
  const seg = 360, pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2, u = Math.cos(a) * 3, v = Math.sin(a) * 3;
    let n = 1 - Math.abs(fbm(u, v, 4, seed)); n *= n;
    let top = baseY + lerp(minH, maxH, n) + (vnoise(i * 0.9, 0, seed + 3) - 0.5) * bumps;
    // vão nas montanhas exatamente onde o sol se põe
    const sunA = Math.atan2(-Math.cos(SUN_AZ), Math.sin(SUN_AZ));
    top = lerp(top, notch, 0.85 * Math.exp(-Math.pow(angDiff(a, sunA) / 0.34, 2)));
    const x = Math.cos(a) * radius, z = Math.sin(a) * radius;
    pos.push(x, baseY - 60, z, x, top, z);
    if (i < seg) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
  m.frustumCulled = false;
  scene.add(m);
}

      uniforms: { uCol: { value: new THREE.Color(...color) }, uSize: { value: size }, uPx: { value: 1 } },

      fragmentShader: `uniform vec3 uCol; varying float vL;

  constructor(n = 20) {

    const g = new THREE.BufferGeometry(), idx = [];

    for (let i = 0; i < n - 1; i++) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    g.setIndex(idx);

      vertexShader: `attribute float aA; varying float vA; void main() { vA = aA; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `varying float vA; void main() { gl_FragColor = vec4(vec3(1.0, 0.93, 0.8) * vA * 1.4, vA); }`,
    });

    this.alpha = Math.max(0, this.alpha - dt * 5.5);
    if (this.alpha === 0) { this.b.length = 0; this.t.length = 0; }
    const L = this.b.length;
    for (let i = 0; i < this.n; i++) {
      const j = Math.min(i, Math.max(L - 1, 0));
      if (L) { const B = this.b[j], T = this.t[j]; this.pos.set([B.x, B.y, B.z], i * 6); this.pos.set([T.x, T.y, T.z], i * 6 + 3); }

/* ================================================================

class CameraRig {

      // mantém o alvo dentro do enquadramento sem "grudar" a câmera nele
      // câmera gira um pouco para a esquerda da linha até o alvo: jogador à esquerda, oponente à direita da tela
      const d = angDiff(this.yaw, yawTo(player.pos, tg.pos) + 0.55), ex = Math.abs(d) - 0.14;

    this.pivot.z = damp(this.pivot.z, player.pos.z, 14, dt);
    this.pivot.y = damp(this.pivot.y, player.pos.y + C.pivotH + this.stanceK * 0.12, 7, dt);

    const fwd = new THREE.Vector3(-Math.sin(this.yaw) * cp, sp, -Math.cos(this.yaw) * cp);
    const right = new THREE.Vector3(Math.cos(this.yaw), 0, -Math.sin(this.yaw));
    const want = C.dist + this.runK * 0.35 + this.intro * 2.2 + this.stanceK * C.stanceDist;
    const base = this.pivot.clone().addScaledVector(right, C.shoulder + this.stanceK * 0.22);
    let dist = want;
    for (let step = 0; step < 16; step++) {
      const cx = base.x - fwd.x * dist, cy = base.y - fwd.y * dist, cz = base.z - fwd.z * dist;
      let hit = false;
      for (const c of colliders) {
        const ddx = cx - c.x, ddz = cz - c.z;
        if (ddx * ddx + ddz * ddz < (c.r + 0.3) ** 2 && cy < c.top + 0.3) { hit = true; break; }
      }
      if (!hit) break;
      dist -= 0.3;
    }
    dist = Math.max(dist, 0.9);
    this.dist = dist < this.dist ? dist : damp(this.dist, dist, 3, dt);
    const pos = base.clone().addScaledVector(fwd, -this.dist);
    pos.y += this.intro * 1.2;
    pos.y = Math.max(pos.y, terrain.heightAt(pos.x, pos.z) + C.minClear);

    this.trauma = Math.max(0, this.trauma - dt * 2.2);
    const s = this.trauma * this.trauma;
    const shY = (vnoise(t * 32, 0.5, 3) - 0.5) * s * 0.06, shP = (vnoise(0.5, t * 32, 4) - 0.5) * s * 0.06, shR = (vnoise(t * 26, t * 26, 5) - 0.5) * s * 0.05;
    const breathe = Math.sin(t * 0.9) * 0.0035, sway = Math.sin(t * 0.6 + 1.3) * 0.0025;
    camera.position.copy(pos);
    camera.rotation.set(this.pitch - this.intro * 0.12 + breathe + shP, this.yaw + sway + shY, shR);
    this.punchK = Math.max(0, this.punchK - dt * 9 * Math.max(1, this.punchK * 0.4));

    if (this.cineUntil && clock.elapsed > this.cineUntil) { this.cine = null; this.cineUntil = 0; }
    this.blend = this.cine ? Math.min(1, this.blend + dt * 2.2) : Math.max(0, this.blend - dt * 1.8);
    if (this.cine) {
      const A = this.cine.a.pos, B = this.cine.b.pos, c = this.cine;
      const dx = B.x - A.x, dz = B.z - A.z, L = Math.hypot(dx, dz) || 1, ux = dx / L, uz = dz / L;
      const mx = (A.x + B.x) / 2, mz = (A.z + B.z) / 2, my = (A.y + B.y) / 2;
      const px = mx - uz * c.side * c.dist + ux * c.back, pz = mz + ux * c.side * c.dist + uz * c.back;
      const py = Math.max(terrain.heightAt(px, pz) + 0.55, my + 1.2 + c.h);
      this.cPos.set(px, py, pz);
      this.cMat.lookAt(this.cPos, _v.set(mx, my + c.look, mz), _up);
      this.cQuat.setFromRotationMatrix(this.cMat); this.hasCine = true;
    }
    if (this.blend > 0 && this.hasCine) {
      const k = easeInOut(this.blend);
      camera.position.lerp(this.cPos, k); camera.quaternion.slerp(this.cQuat, k);
    }
    const fov = C.fov + this.runK * (C.fovRun - C.fov) - this.punchK;
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }

  }
}

/* ================================================================
   ENCONTROS — três lutas na trilha, cada uma com checkpoint
   ================================================================ */
const Encounters = {
  list: [], enemies: [], checkpoint: null, cpYaw: 0, finished: false,
  init() {
    const defs = [
      { z: 108, spawn: [[0, 0, 'recruta']], hint: 'Inimigos se defendem de frente. Apare e pressione a guarda para quebrar a estabilidade deles.' },
      { z: 38, spawn: [[-1.6, 0, 'recruta'], [1.8, -2.0, 'agressivo']], hint: 'O de laranja ataca sem parar. Só defender vai quebrar você: apare ou esquive.' },
      { z: -35, spawn: [[0, 0, 'paciente']], hint: 'O de azul espera e apara. Golpes em sequência são punidos: seja paciente também.' },
      { z: -100, spawn: [[0, 0, 'duelista']], duel: true },
    ];
    for (const d of defs) {
      const c = pathAtZ(d.z), back = pathAtZ(d.z + 15);
      const enemies = d.spawn.map(([ox, oz, type]) => new Enemy(new THREE.Vector3(c.x + ox, 0, c.z + oz), type));
      this.enemies.push(...enemies);
      this.list.push({ ...d, center: c, cp: back, enemies, active: false, cleared: false });
    }
    this.checkpoint = { x: player.pos.x, z: player.pos.z }; this.cpYaw = 0;
  },
  update(dt, t) {
    for (let i = 0; i < this.list.length; i++) {
      const E = this.list[i];
      if (E.cleared) continue;
      const d = Math.hypot(player.pos.x - E.center.x, player.pos.z - E.center.z);
      if (!E.active && d < 15 && player.alive) {
        E.active = true;
        this.checkpoint = { x: E.cp.x, z: E.cp.z }; this.cpYaw = yawTo(E.cp, E.center);
        if (E.duel) { Sound.gong(); Game.dusk = true; Standoff.begin(E.enemies[0]); }
        else E.enemies.forEach((e) => (e.aware = true));
        if (E.duel) {}
        else if (E.hint && !E.hinted) { E.hinted = true; UI.clear(); UI.hint(E.hint, 7); }
      }
      if (E.active && E.enemies.every((e) => !e.alive)) {
        E.cleared = true; player.health = player.maxHealth;
        setTimeout(() => { if (!player.target) player.ritual(); }, 900);
        if (i === this.list.length - 1) Game.finish();
        else setTimeout(() => UI.hint('Siga a trilha', 4), 1200);
      }
    }
  },
  resetActive() {
    if (Standoff.active) { Standoff.active = false; document.body.classList.remove('cine'); rig.clearCine(); }
    for (const E of this.list) if (E.active && !E.cleared) { E.active = false; E.enemies.forEach((e) => e.reset()); }
    Director.reset();
  },
};

/* ================================================================
   IMPASSE — antes do duelo, os dois se encaram. Segure o ataque e solte
   no instante em que ele avançar. Ele pode tremer para enganar (finta).
   ================================================================ */
const Standoff = {
  active: false, phase: '', t: 0, e: null, feints: [], goAt: 0, heldOnce: false, it: {}, eit: {}, strikeT: 0, ok: false, why: '',
  begin(e) {
    this.active = true; this.e = e; this.phase = 'approach'; this.t = 0; this.heldOnce = false; this.strikeT = 0;
    e.brain = 'standoff'; e.aware = false;
    player.sheathe();
    document.body.classList.add('cine'); UI.clear();
    rig.setCine(player, e, { side: 1, dist: 5.4, h: 0.25, look: 1.15, back: 0.4 });
    this.goAt = 2.2 + rand() * 2.6;
    this.feints = [];
    const nf = rand() < 0.45 ? 1 : 2;
    for (let i = 0; i < nf; i++) this.feints.push({ at: this.goAt * (0.25 + 0.55 * rand()), done: false });
  },
  blank(it) { it.atk = false; it.dodge = false; it.bPress = false; it.blockHeld = false; it.wx = 0; it.wz = 0; it.mag = 0; it.run = false; it.atkIndex = undefined; it.analog = 1; it.atkHeld = false; return it; },
  update(dt, t) {
    const p = player, e = this.e, it = this.blank(this.it), eit = this.blank(this.eit);
    const dx = e.pos.x - p.pos.x, dz = e.pos.z - p.pos.z, d = Math.hypot(dx, dz) || 1;
    e.yaw = yawTo(e.pos, p.pos);
    Input.take('attack'); Input.take('dodge'); Input.take('blockPress'); // ignora toques durante o impasse
    const held = Input.attackHeld;
    switch (this.phase) {
      case 'approach':
        it.wx = dx / d; it.wz = dz / d; it.mag = 1; it.analog = 0.9;
        if (d <= 6.3) { this.phase = 'hold'; UI.stick(T_('Segure o botão esquerdo. Solte no instante em que ele avançar.', 'Segure o botão da espada. Solte no instante em que ele avançar.')); }
        break;
      case 'hold':
        p.yaw = damp(p.yaw, yawTo(p.pos, e.pos), 8, dt);
        if (!held) { if (this.heldOnce) this.fail('Cedo demais'); break; }
        if (!this.heldOnce) { this.heldOnce = true; UI.stick('Espere…'); }
        this.t += dt;
        for (const f of this.feints) if (!f.done && this.t >= f.at) {

          f.done = true; this.twitch = 0.16; Sound.feint(); Sound.cloth();

        }
        if (this.twitch > 0) { this.twitch -= dt; eit.wx = -dx / d; eit.wz = -dz / d; eit.mag = 1; eit.analog = 0.5; }
        if (this.t >= this.goAt) { this.phase = 'go'; this.goT = 0; e.speeds.run = 11; e.draw(); Sound.draw(); UI.clear(); }
        break;
      case 'go':
        this.goT += dt;
        eit.wx = -dx / d; eit.wz = -dz / d; eit.mag = 1; eit.run = true;
        if (!held) { this.succeed(t); break; }
        if (d < 1.4 || this.goT > 0.6) this.fail('Tarde demais');
        break;
      case 'strike':
        this.strikeT += dt;

          if (this.ok) {
            e.takeHit(p.pos, true, t); e.loseStab(40, t); if (e.alive && e.state !== 'broken') e.stagger(1.3, p.pos);
            Sound.slash(); Sound.gongSoft(); UI.flash('Primeiro golpe'); Fx.punch(6); Fx.shake(0.5); buzz([40, 50, 80]);
            bloodFx.emit(_v.set(e.pos.x, e.pos.y + 1.2, e.pos.z).clone(), _up, 14, 3, 0.8, 0.6);
          } else {
            p.takeHit(e.pos, true, t); Sound.slash(); Fx.shake(0.6); buzz(90);
          }

        if (this.strikeT > 1.0) this.end();
        break;
    }

    e.update(dt, t, eit, []);

  },
  succeed(t) {
    this.phase = 'strike'; this.ok = true; this.resolved = false; this.strikeT = 0;
    Time.slow(0.22, 1.0); player.draw(); player.startAttack(0, t); player.hitSet.add(this.e);
  },
  fail(why) {

  end() {
    this.active = false; this.phase = '';

  },

    const above = smooth(-0.01, 0.03, SUN.y);
    this.k = damp(this.k, smooth(0.72, 0.985, dot) * above, 6, dt);
    this.adapt = damp(this.adapt, this.k, 0.7, dt);
    camera.updateMatrixWorld();
    _v.copy(camera.position).addScaledVector(SUN, 1000).project(camera);
    const front = dot > 0 && _v.z < 1;
    const edge = front ? 1 - smooth(0.7, 1.35, Math.max(Math.abs(_v.x), Math.abs(_v.y))) : 0;
    const amt = TOD.raysMul * smooth(0.1, 0.55, dot) * edge * above * (0.9 + 0.8 * ATMO.uLow.value);
    for (const r of [raysHi, raysLo]) {
      const u = r.material.uniforms;
      u.uSunUv.value.set(_v.x * 0.5 + 0.5, _v.y * 0.5 + 0.5); u.uAmt.value = amt; u.uAspect.value = innerWidth / innerHeight;
      u.uTint.value.setRGB(...TOD.cur.sun);
    }
    const low = ATMO.uLow.value;
    bloom.strength = 0.3 + this.k * (0.12 + 0.25 * low) * TOD.glowMul;
    const ex = TOD.cur.exp * TOD.expMul * (1 - (0.08 + 0.14 * low) * this.adapt);
    renderer.toneMappingExposure = ex; finalPass.material.uniforms.toneMappingExposure.value = ex;
    veilEl.style.opacity = (front ? (0.02 + 0.24 * this.k) * edge * above * TOD.glowMul * (0.25 + 0.75 * low) : 0).toFixed(3);
    if (front) { veilEl.style.left = ((_v.x * 0.5 + 0.5) * innerWidth).toFixed(0) + 'px'; veilEl.style.top = ((-_v.y * 0.5 + 0.5) * innerHeight).toFixed(0) + 'px'; }
  },
};

/* ================================================================
   QUALIDADE — no celular, 30 fps é aceitável: só desce abaixo de ~26
   ================================================================ */
const TIERS = [
  { name: 'mínima', dpr: 0.8,  near: 18000, nearR: 11, mid: 14000, midR: 52,  shadow: 1024, post: false, rays: '',   bloom: false, motes: 90 },
  { name: 'baixa',  dpr: 1.0,  near: 32000, nearR: 14, mid: 20000, midR: 64,  shadow: 1024, post: true,  rays: 'lo', bloom: false, motes: 160 },
  { name: 'média',  dpr: 1.25, near: 55000, nearR: 18, mid: 26000, midR: 80,  shadow: 2048, post: true,  rays: 'lo', bloom: true,  motes: 240 },
  { name: 'alta',   dpr: 1.75, near: GRASS_MAX_NEAR, nearR: 22, mid: GRASS_MAX_MID, midR: 110, shadow: 2048, post: true, rays: 'hi', bloom: true, motes: MOTES_MAX },
];
const Quality = {
  tier: 3, auto: !URLP.has('q'), maxAuto: IS_TOUCH ? 2 : 3, acc: 0, n: 0, cool: 3, good: 0, upBlock: 0,
  down: IS_TOUCH ? 26 : 44, up: IS_TOUCH ? 52 : 57,
  apply(i) {
    this.tier = clamp(i, 0, TIERS.length - 1);
    const T = TIERS[this.tier], dpr = Math.min(devicePixelRatio || 1, T.dpr);
    renderer.setPixelRatio(dpr); composer.setPixelRatio(dpr);
    resize();
    const un = grassNear.material.uniforms, um = grassMid.material.uniforms;
    grassNear.geometry.instanceCount = T.near; un.uSize.value = T.nearR * 2; un.uRadius.value = T.nearR;
    grassMid.geometry.instanceCount = T.mid; um.uSize.value = T.midR * 2; um.uRadius.value = T.midR; um.uNearR.value = T.nearR;
    this.post = T.post; bloom.enabled = T.bloom; raysHi.enabled = T.rays === 'hi'; raysLo.enabled = T.rays === 'lo';
    skyMat.uniforms.uGlow.value = T.bloom ? 0 : 1;
    sunLight.castShadow = T.shadow > 0;
    if (T.shadow > 0 && sunLight.shadow.mapSize.x !== T.shadow) {
      sunLight.shadow.mapSize.set(T.shadow, T.shadow);
      if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
    }
    motes.geometry.setDrawRange(0, T.motes);
    [motes.material, sparks.mat, splinters.mat, bloodFx.mat, dustFx.mat, leafFx.mat].forEach((m) => (m.uniforms.uPx.value = dpr));
  },
  frame(dt) {
    if (!this.auto) return;
    this.cool -= dt; this.upBlock -= dt; this.acc += dt; this.n++;
    if (this.acc < 2) return;
    const fps = this.n / this.acc; this.acc = 0; this.n = 0;
    if (this.cool > 0) return;
    if (fps < this.down * 0.6 && this.tier > 0) { this.apply(Math.max(0, this.tier - 2)); this.cool = 3; this.upBlock = 30; this.good = 0; }
    else if (fps < this.down && this.tier > 0) { this.apply(this.tier - 1); this.cool = 3; this.upBlock = 30; this.good = 0; }
    else if (fps > this.up && this.tier < this.maxAuto && this.upBlock <= 0) { if (++this.good >= 3) { this.apply(this.tier + 1); this.cool = 3; this.good = 0; } }
    if (Panel.open) Panel.refreshQ();
    else this.good = 0;
  },
};
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ================================================================
   PAINEL DE AJUSTE E RELATÓRIO — toque no contador de FPS (ou tecla P)
   ================================================================ */
const Panel = {
  open: false, el: document.getElementById('panel'),
  settings: { tod: -1, fog: 1, glow: 1, rays: 1, exp: 1, parry: 160, q: -1 },
  init() {
    try { Object.assign(this.settings, JSON.parse(localStorage.getItem('fio-lamina-ajustes') || '{}')); } catch (e) {}
    const S = this.settings, el = this.el;
    const row = (label, key, min, max, step, fmt) => {
      const w = document.createElement('label'); w.className = 'row';
      w.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
      const inp = w.querySelector('input'), out = w.querySelector('output');
      inp.value = S[key]; out.textContent = fmt(+inp.value);
      inp.addEventListener('input', () => { S[key] = +inp.value; out.textContent = fmt(S[key]); this.apply(); });
      el.querySelector('.sliders').appendChild(w);
    };
    row('Hora do dia (−1 = automática)', 'tod', -1, 1, 0.01, (v) => (v < 0 ? 'automática' : Math.round(v * 100) + '%'));
    row('Neblina', 'fog', 0.3, 2, 0.05, (v) => v.toFixed(2) + '×');
    row('Brilho do sol', 'glow', 0, 2, 0.05, (v) => v.toFixed(2) + '×');
    row('Raios de luz', 'rays', 0, 2.5, 0.05, (v) => v.toFixed(2) + '×');
    row('Exposição', 'exp', 0.7, 1.3, 0.01, (v) => v.toFixed(2) + '×');
    row('Janela de aparar', 'parry', 100, 300, 5, (v) => v + ' ms');
    el.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => {
      const q = +b.dataset.q; S.q = q;
      if (q < 0) Quality.auto = true; else { Quality.auto = false; Quality.apply(q); }
      this.save(); this.refreshQ();
    }));
    el.querySelector('#pClose').addEventListener('click', () => this.toggle(false));
    el.querySelector('#pReport').addEventListener('click', () => this.copy(this.report(), 'Relatório copiado'));
    el.querySelector('#pSettings').addEventListener('click', () => this.copy('Ajustes do Fio da Lâmina: ' + JSON.stringify(this.settings), 'Ajustes copiados'));
    el.querySelector('#pReset').addEventListener('click', () => { this.settings = { tod: -1, fog: 1, glow: 1, rays: 1, exp: 1, parry: 160, q: -1 }; this.save(); location.reload(); });
    addEventListener('keydown', (e) => { if (e.code === 'KeyP') this.toggle(); });
    if (S.q >= 0) { Quality.auto = false; Quality.apply(S.q); }
    this.apply(); this.refreshQ();
  },
  refreshQ() { this.el.querySelectorAll('[data-q]').forEach((b) => b.classList.toggle('on', +b.dataset.q === (Quality.auto ? -1 : Quality.tier))); },
  apply() {
    const S = this.settings;
    TOD.auto = S.tod < 0; TOD.override = Math.max(0, S.tod); TOD.fogMul = S.fog; TOD.glowMul = S.glow; TOD.raysMul = S.rays; TOD.expMul = S.exp; TOD.dirty = true;
    CFG.combat.parryWindow = S.parry / 1000;
    this.save();
  },
  save() { try { localStorage.setItem('fio-lamina-ajustes', JSON.stringify(this.settings)); } catch (e) {} },
  toggle(on = !this.open) {
    this.open = on; this.el.hidden = !on;
    if (on) { this.refreshQ(); if (document.pointerLockElement) document.exitPointerLock(); }
  },
  async copy(text, ok) {
    try { await navigator.clipboard.writeText(text); UI.flash(ok); }
    catch (e) { const ta = this.el.querySelector('textarea'); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); UI.flash('Selecione e copie'); }
  },
  report() {
    const C = Report.contacts.filter((c) => c.src !== 'boneco'), all = Report.contacts;
    const by = (r) => all.filter((c) => c.res === r).length;
    const avg = (a) => (a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : '—');
    const parried = all.filter((c) => c.res === 'parry' && c.pressMs !== null).map((c) => c.pressMs);
    const early = all.filter((c) => (c.res === 'block' || c.res === 'hit') && c.pressMs !== null && c.pressMs > CFG.combat.parryWindow * 1000).map((c) => c.pressMs);
    const late = all.filter((c) => c.lateMs !== null).map((c) => c.lateMs);
    const types = [...new Set(C.map((c) => c.src))].map((src) => {
      const x = C.filter((c) => c.src === src);
      return `${src}: ${x.length} golpes, aparou ${x.filter((c) => c.res === 'parry').length}, defendeu ${x.filter((c) => c.res === 'block').length}, esquivou ${x.filter((c) => c.res === 'dodge' || c.res === 'pdodge').length}, levou ${x.filter((c) => c.res === 'hit').length}`;
    });
    return [
      'Fio da Lâmina — relatório de luta',
      `Aparelho: ${navigator.userAgent}`,
      `Qualidade: ${TIERS[Quality.tier].name} (${Quality.auto ? 'automática' : 'fixa'}), ${stats.textContent}`,
      `Janela de aparar: ${Math.round(CFG.combat.parryWindow * 1000)} ms`,
      `Golpes recebidos: ${all.length} (aparou ${by('parry')}, defendeu ${by('block')}, esquivou ${by('dodge') + by('pdodge')}, perfeitas ${by('pdodge')}, levou ${by('hit')})`,
      `Aparos: apertou em média ${avg(parried)} ms antes do golpe`,
      `Cedo demais: ${early.length} vezes, em média ${avg(early)} ms antes (a janela é ${Math.round(CFG.combat.parryWindow * 1000)} ms)`,
      `Tarde demais: ${late.length} vezes, em média ${avg(late)} ms depois do golpe`,
      ...types,
      `Aparos: ${Stats.parries}, golpes decisivos: ${Stats.decisive}, inimigos vencidos: ${Stats.kills}, quedas: ${Stats.deaths}`,
      `Ajustes: ${JSON.stringify(this.settings)}`,
    ].join('\n');
  },
};

/* ================================================================
   LOOP
   ================================================================ */
const clock = { elapsed: 0, last: performance.now() };
let simT = 0;
const player = new Player(new THREE.Vector3(CLEARING.x, 0, CLEARING.z + 5));
const dummy = new Dummy(DUMMY_POS.x, DUMMY_POS.z);
Encounters.init();
const rig = new CameraRig();
rig.snap(player.pos);
Input.init();

const stats = document.getElementById('stats');
let fpsAcc = 0, fpsN = 0, fpsT = 0;
stats.addEventListener('click', (e) => { e.stopPropagation(); Panel.toggle(); });
document.getElementById('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); Panel.toggle(); });

const startEl = document.getElementById('start');
document.getElementById('ctlText').textContent = IS_TOUCH
  ? 'Polegar esquerdo anda (empurre até a borda para correr), polegar direito olha. Botões à direita: golpe, defesa e esquiva.'
  : 'WASD anda, Shift corre, mouse olha. Botão esquerdo golpeia, direito defende, Espaço esquiva.';
document.getElementById('goText').textContent = IS_TOUCH ? 'Toque para começar' : 'Clique para começar';

function start() {
  if (Input.enabled || Game.ended) return;
  Input.enabled = true; Stats.startT = clock.elapsed;
  Sound.init();
  startEl.classList.add('gone');
  if (IS_TOUCH) {
    document.getElementById('touchUI').hidden = false;
    const fs = document.documentElement.requestFullscreen?.();
    if (fs && fs.then) fs.then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {});
  } else {
    const p = canvas.requestPointerLock?.();
    if (p && p.catch) p.catch(() => { Input.noLock = true; });
  }
  canvas.focus();
  setTimeout(() => Training.show(), 900);
}
startEl.addEventListener('click', start);
startEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });

const tmpV = new THREE.Vector3();
const TEST = URLP.has('test');
function render() { if (Quality.post) composer.render(); else renderer.render(scene, camera); }
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - clock.last) / 1000; clock.last = now;
  dt = Math.min(dt, 0.05);
  update(dt);
  render();
  Quality.frame(dt);
  fpsAcc += dt; fpsN++; fpsT += dt;
  if (fpsT > 0.5) { stats.textContent = `${Math.round(fpsN / fpsAcc)} fps, qualidade ${TIERS[Quality.tier].name}`; fpsAcc = 0; fpsN = 0; fpsT = 0; }
}
function update(realDt) {
  clock.elapsed += realDt;
  const t = clock.elapsed;
  const dt = Panel.open ? 0 : Time.step(realDt);
  simT += dt;
  SH.uTime.value = simT;

  Input.update();
  const targets = [dummy];
  for (const e of Encounters.enemies) if (e.alive) targets.push(e);
  const speed = Standoff.active ? Standoff.update(dt, simT) : player.tick(dt, simT, rig.yaw, targets);
  for (const e of Encounters.enemies) if (!(Standoff.active && e === Standoff.e)) e.tick(dt, simT, player);
  dummy.update(dt, simT, player);
  Training.update(realDt, player, dummy);
  Encounters.update(realDt, simT);
  Game.update(realDt);
  Habits.update(realDt, player, Encounters.enemies.some((e) => e.alive && e.aware && e.pos.distanceTo(player.pos) < 5));
  sparks.update(dt); splinters.update(dt); bloodFx.update(dt); dustFx.update(dt); leafFx.update(dt);
  Game.atmosphere(dt);
  if (Input.enabled) rig.intro = damp(rig.intro, 0, 1.6, realDt);
  const fwd = rig.update(realDt, t, player, speed);

  const T = TIERS[Quality.tier], f2 = tmpV.set(fwd.x, 0, fwd.z).normalize();
  const nc = grassNear.material.uniforms.uCenter.value.set(camera.position.x + f2.x * T.nearR * 0.55, 0, camera.position.z + f2.z * T.nearR * 0.55);
  grassMid.material.uniforms.uCenter.value.set(camera.position.x + f2.x * T.midR * 0.5, 0, camera.position.z + f2.z * T.midR * 0.5);
  grassMid.material.uniforms.uNearCenter.value.copy(nc);
  // grama afastada e sombra longa: jogador, câmera e os 2 inimigos vivos mais próximos
  SH.uPush.value[0].set(player.pos.x, player.pos.z, player.drawn ? 1.5 : 0.95, player.drawn ? 1.1 : 0.9);
  SH.uPush.value[1].set(camera.position.x, camera.position.z, 1.3, camera.position.y - terrain.heightAt(camera.position.x, camera.position.z) < 2.2 ? 0.9 : 0);
  SH.uCast.value[0].set(player.pos.x, player.pos.z, player.alive && player.state !== 'down' ? 1.75 : 0.5, 1);
  const near = Encounters.enemies.filter((e) => e.alive).sort((a, b) => a.pos.distanceToSquared(player.pos) - b.pos.distanceToSquared(player.pos));
  for (let k = 0; k < 2; k++) {
    const e = near[k];
    if (e) { SH.uPush.value[2 + k].set(e.pos.x, e.pos.z, e.drawn ? 1.5 : 0.95, e.drawn ? 1.1 : 0.9); SH.uCast.value[2 + k].set(e.pos.x, e.pos.z, 1.75, 1); }
    else { SH.uPush.value[2 + k].w = 0; SH.uCast.value[2 + k].w = 0; }
  }
  const dd = Math.hypot(dummy.pos.x - player.pos.x, dummy.pos.z - player.pos.z);
  SH.uCast.value[1].set(dummy.pos.x, dummy.pos.z, 2.1, dd < 60 ? 1 : 0);

  const snapStep = 44 / Math.max(sunLight.shadow.mapSize.x, 1);
  const sx = Math.round(player.pos.x / snapStep) * snapStep, sz = Math.round(player.pos.z / snapStep) * snapStep;
  sunLight.target.position.set(sx, player.pos.y, sz);
  sunLight.position.set(sx + SUN.x * 90, player.pos.y + SUN.y * 90, sz + SUN.z * 90);

  TOD.update(realDt, player);
  Glare.update(realDt);
  const fighting = Encounters.enemies.some((e) => e.alive && e.aware && e.pos.distanceTo(player.pos) < 12);
  Sound.music(realDt, Standoff.active && Standoff.phase !== 'strike' ? 'standoff' : fighting ? 'combat' : 'explore', Math.max(0, TOD.k));
  grainEl.style.transform = `translate(${(Math.random() * 160) | 0}px, ${(Math.random() * 160) | 0}px)`;
  UI.update(realDt, player, t);
}

Quality.apply(URLP.has('q') ? +URLP.get('q') : (IS_TOUCH ? 1 : 3));
if (!URLP.has('test')) Panel.init();
if (!TEST) requestAnimationFrame((n) => { clock.last = n; frame(n); });
document.getElementById('loading').classList.add('gone');
window.__game = { Standoff, Panel, TOD, Report, update, render, player, dummy, rig, Input, Quality, Training, Time, Encounters, Director, Stats, Game, Habits, terrain, camera, start,
  step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); render(); } };
</script>
</body>
</html>
